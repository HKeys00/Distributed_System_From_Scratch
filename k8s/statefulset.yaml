apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql-sfs
spec:
  selector:
    matchLabels:
      app: postgresql-a
  serviceName: 'postgresql-svc'
  replicas: 1
  template:
    metadata:
      labels:
        app: postgresql-a
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgresql-db
          image: postgres:16
          env:
            - name: POSTGRES_PASSWORD
              value: mypassword
          ports:
            - containerPort: 5432
              name: postgresql-port
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 1Gi
        storageClassName: standard