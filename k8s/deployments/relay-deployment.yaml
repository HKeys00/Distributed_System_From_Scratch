apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      containers:
        - name: relay
          image: ghcr.io/hkeys00/relay:latest
          ports:
            - containerPort: 8080
          imagePullSecrets:
            - name: ghcr-secret
