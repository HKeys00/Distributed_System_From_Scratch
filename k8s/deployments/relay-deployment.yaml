apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      containers:
        - name: relay
          image: 'ghcr.io/hkeys00/relay@sha256:ad55bfa899e2e8a7e17ac4430fb6366344aa1608054cac330da1af8da60638f7'
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__DefaultConnection
              value: "Host=postgresql-sfs-0.postgresql-svc.default.svc.cluster.local;Port=5432;Database=postgres;Username=postgres;Password=mypassword"
            - name: ConnectionStrings__RabbitMq
              value: "amqp://myuser:mypassword@rabbitmq-sfs-0.rabbitmq-svc:5672"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      imagePullSecrets:
        - name: ghcr-secret
