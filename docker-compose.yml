services:
  postgres_db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"

  data:
    build:
        context: .
        dockerfile: Data/Dockerfile
    container_name: data
    working_dir: /app
    depends_on:
      - postgres_db

  controllers:
    build:
        context: .
        dockerfile: Controllers/Dockerfile
    container_name: controllers
    working_dir: /app
    ports:
      - "5001:5000"
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
    depends_on:
      - data

