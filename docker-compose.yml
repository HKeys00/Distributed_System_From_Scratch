services:
  postgres_db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"

  data:
    build:
        context: .
        dockerfile: Data/Dockerfile
    container_name: data
    working_dir: /app
    depends_on:
      - postgres_db

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports: 
      - 5672:5672
      - 15672:15672

  controllers:
    build:
        context: .
        dockerfile: Controllers/Dockerfile
    container_name: controllers
    working_dir: /app
    ports:
      - "5001:5000"
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
    depends_on:
      - data

  relay:
    build:
        context: .
        dockerfile: Relay/Dockerfile
    container_name: relay
    working_dir: /app
    depends_on:
      - data
      - rabbitmq 

  worker-node:
    build:
        context: .
        dockerfile: Worker_Node/Dockerfile
    container_name: worker-node
    working_dir: /app
    environment:
      NODE_ID: A
      DATA_DIR: /data
      PEERS:
    depends_on:
      data: 
            condition: service_started
      rabbitmq:
            condition: service_healthy
volumes:
  pgdata:

