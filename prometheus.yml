global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: controllers
    static_configs:
      - targets: ['controllers:9101']

  - job_name: relay
    dns_sd_configs:
      - names: ['relay']
        type: A
        port: 9102
        refresh_interval: 15s

  - job_name: worker-node
    static_configs:
      - targets: ['worker-node:9103']

  - job_name: data
    static_configs:
      - targets: ['data:9104']
